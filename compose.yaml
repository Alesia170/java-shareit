services:
  db:
    image: postgres:16.1
    container_name: share
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=shareit
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345
      - TZ=Europe/Moscow
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  server:
    build: ./server
    container_name: shareit-server
    depends_on:
      - db
    ports:
      - "9090:9090"
    environment:
      - TZ=Europe/Moscow
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Europe/Moscow

  gateway:
    build: ./gateway
    container_name: shareit-gateway
    depends_on:
      - server
    ports:
      - "8080:8080"
    environment:
      - SHAREIT_SERVER_URL=http://server:9090
      - TZ=Europe/Moscow
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Europe/Moscow
